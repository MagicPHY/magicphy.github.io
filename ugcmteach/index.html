<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>PHYの绿洲共创教程</title>
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --glass-alpha: 0.22;
            --glass-blur: 20px;
            --glass-blur-light: 12px;
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-bg: rgba(255, 255, 255, var(--glass-alpha));
            --glass-bg-hover: rgba(255, 255, 255, calc(var(--glass-alpha) + 0.18));
            --glass-shadow: 0 8px 32px rgba(30, 60, 130, 0.06);
            --primary-blue: #2a6fd4;
            --primary-light: #4a8af4;
            --text-dark: #0a2647;
            --text-muted: #3a5a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #dce6f5;
            transition: background 0.6s ease;
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.2s ease;
            filter: brightness(1.04) saturate(1.08);
        }
        #bg-layer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            max-height: 96vh;
            overflow-y: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: 40px;
            padding: 26px 28px 28px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: background 0.4s ease, backdrop-filter 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            scroll-behavior: smooth;
            opacity: 0;
            animation: fadeIn 0.7s ease forwards 0.15s;
        }
        .app-container::-webkit-scrollbar {
            width: 5px;
        }
        .app-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: rgba(70, 130, 255, 0.25);
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .app-container.glass-liquid {
            background: rgba(255, 255, 255, calc(var(--glass-alpha) * 0.85));
            backdrop-filter: blur(calc(var(--glass-blur) + 4px));
            -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 4px));
            border-color: rgba(255, 255, 255, 0.30);
            box-shadow: 0 30px 80px rgba(30, 60, 130, 0.10), 0 8px 32px rgba(30, 60, 130, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }
        .app-container.glass-liquid::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 28% 42%, rgba(120, 200, 255, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 72% 78%, rgba(80, 140, 255, 0.05) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            animation: liquidFlow 18s ease-in-out infinite alternate;
        }
        .app-container.glass-liquid::after {
            content: '';
            position: absolute;
            top: -70%;
            left: -70%;
            width: 240%;
            height: 240%;
            background: radial-gradient(circle at 55% 28%, rgba(255, 255, 255, 0.06) 0%, transparent 38%);
            pointer-events: none;
            z-index: 0;
            animation: liquidShine 22s ease-in-out infinite alternate;
        }
        @keyframes liquidFlow {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(3%, 2%) rotate(1.5deg);
            }
            66% {
                transform: translate(-2%, 3%) rotate(-1deg);
            }
            100% {
                transform: translate(2%, -2%) rotate(0.8deg);
            }
        }
        @keyframes liquidShine {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(4%, -4%) scale(1.08);
            }
            100% {
                transform: translate(-3%, 3%) scale(0.94);
            }
        }
        .app-container.glass-liquid>* {
            position: relative;
            z-index: 1;
        }

        .app-container.glass-liquid .category-card,
        .app-container.glass-liquid .child-node,
        .app-container.glass-liquid .search-wrap,
        .app-container.glass-liquid .about-section .feedback-btn,
        .app-container.glass-liquid .about-section .social-link,
        .app-container.glass-liquid .about-section .icp-link,
        .app-container.glass-liquid .footer-top,
        .app-container.glass-liquid .controls-float .control-group,
        .app-container.glass-liquid .header,
        .app-container.glass-liquid .empty-state {
            background: rgba(255, 255, 255, calc(var(--glass-alpha) * 0.9));
            backdrop-filter: blur(var(--glass-blur-light));
            -webkit-backdrop-filter: blur(var(--glass-blur-light));
            border-color: rgba(255, 255, 255, 0.25);
        }
        .app-container.glass-liquid .child-node:hover,
        .app-container.glass-liquid .about-section .feedback-btn:hover,
        .app-container.glass-liquid .about-section .social-link:hover {
            background: rgba(255, 255, 255, calc(var(--glass-alpha) * 1.3 + 0.15));
        }
        .app-container.glass-liquid .search-wrap:focus-within {
            background: rgba(255, 255, 255, calc(var(--glass-alpha) * 1.2 + 0.15));
        }
        .app-container.glass-liquid .category-card {
            background: rgba(255, 255, 255, calc(var(--glass-alpha) * 0.8));
            backdrop-filter: blur(calc(var(--glass-blur-light) - 2px));
            -webkit-backdrop-filter: blur(calc(var(--glass-blur-light) - 2px));
            border-radius: 30px;
            padding: 12px 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.30);
            box-shadow: 0 4px 20px rgba(30, 60, 130, 0.03);
            transition: all 0.3s ease;
        }
        .app-container.glass-liquid .category-card:hover {
            background: rgba(255, 255, 255, calc(var(--glass-alpha) * 1.0 + 0.05));
            border-color: rgba(255, 255, 255, 0.45);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 16px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.40);
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 0 1 auto;
        }
        .author-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(40, 80, 180, 0.08);
            background: rgba(200, 220, 255, 0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .author-avatar:hover {
            transform: scale(1.04);
        }
        .author-avatar-fallback {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a9eff, #3a7bd5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }
        .author-info {
            display: flex;
            flex-direction: column;
        }
        .author-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .author-name span {
            background: linear-gradient(135deg, #1a5fb4, #4a8af4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 4px 16px rgba(30, 60, 130, 0.03);
            transition: all 0.3s ease;
            min-width: 150px;
            flex: 1 1 160px;
        }
        .search-wrap:focus-within {
            border-color: rgba(70, 130, 255, 0.35);
            box-shadow: 0 4px 24px rgba(70, 130, 255, 0.06);
            background: rgba(255, 255, 255, 0.60);
        }
        .search-wrap .search-icon {
            color: #4a7ab0;
            font-size: 17px;
            margin-right: 6px;
            opacity: 0.5;
            flex-shrink: 0;
        }
        .search-wrap input {
            border: none;
            background: transparent;
            padding: 9px 0;
            font-size: 14px;
            color: var(--text-dark);
            width: 100%;
            outline: none;
            font-weight: 400;
            min-width: 60px;
        }
        .search-wrap input::placeholder {
            color: #8aacd0;
            font-weight: 300;
            letter-spacing: 0.2px;
        }
        .search-wrap .clear-btn {
            background: none;
            border: none;
            color: #7a9ac0;
            font-size: 16px;
            cursor: pointer;
            padding: 0 0 0 4px;
            display: none;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .search-wrap .clear-btn:hover {
            color: #1a5fb4;
        }
        .search-wrap .clear-btn.visible {
            display: block;
        }

        /* ===== 关于容器 ===== */
        .about-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.30);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 20px rgba(30, 60, 130, 0.04);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .about-section:hover {
            background: rgba(255, 255, 255, 0.45);
            border-color: rgba(255, 255, 255, 0.50);
        }
        .about-section .feedback-btn,
        .about-section .social-link,
        .about-section .icp-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 60px;
            padding: 6px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #1a4a7a;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(30, 60, 130, 0.03);
            white-space: nowrap;
        }
        .about-section .feedback-btn:hover,
        .about-section .social-link:hover {
            background: rgba(255, 255, 255, 0.65);
            border-color: rgba(70, 130, 255, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(70, 130, 255, 0.07);
        }
        .about-section .feedback-btn .icon,
        .about-section .social-link .icon {
            font-size: 16px;
        }
        .about-section .icp-link {
            background: transparent;
            backdrop-filter: none;
            border: none;
            padding: 0 4px;
            font-weight: 400;
            color: #4a7ab0;
            font-size: 13px;
            box-shadow: none;
        }
        .about-section .icp-link:hover {
            background: transparent;
            transform: none;
            color: #1a5fb4;
            box-shadow: none;
        }
        .about-section .social-link .icon {
            display: none;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.30);
            display: flex;
            justify-content: center;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .footer-top {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 16px;
            background: rgba(255, 255, 255, 0.30);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 8px 24px;
            border: 1px solid rgba(255, 255, 255, 0.30);
            box-shadow: 0 4px 16px rgba(30, 60, 130, 0.03);
            font-size: 13px;
            color: #4a6a8a;
        }
        .footer-top .count {
            opacity: 0.8;
        }
        .footer-top .count strong {
            color: #1a4a7a;
            font-weight: 600;
        }
        .footer-top .links {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .footer-top .links span {
            opacity: 0.7;
        }

        /* ===== 思维导图 ===== */
        .mindmap {
            margin-top: 4px;
            padding: 4px 0 2px;
        }

        /* ===== 栏目卡片（独立可折叠） ===== */
        .category-card {
            margin-bottom: 18px;
            border-radius: 30px;
            padding: 12px 18px 10px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 20px rgba(30, 60, 130, 0.03);
            transition: all 0.3s ease;
        }
        .category-card:hover {
            background: rgba(255, 255, 255, 0.50);
            border-color: rgba(255, 255, 255, 0.45);
        }
        .category-card .cat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            padding: 6px 4px;
            border-radius: 40px;
            transition: background 0.2s;
        }
        .category-card .cat-header:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .category-card .cat-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-card .cat-title .cat-icon {
            font-size: 24px;
        }
        .category-card .cat-badge {
            font-size: 13px;
            background: rgba(70, 130, 255, 0.08);
            padding: 2px 14px;
            border-radius: 40px;
            color: var(--primary-blue);
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .category-card .cat-toggle {
            font-size: 20px;
            color: #4a7ab0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-left: 12px;
            flex-shrink: 0;
        }
        .category-card .cat-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .category-card .cat-children {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            padding: 14px 4px 4px;
            transition: all 0.4s cubic-bezier(0.34, 1.0, 0.64, 1);
            opacity: 1;
            max-height: 3000px;
            overflow: hidden;
        }
        .category-card .cat-children.hidden {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin: 0;
            pointer-events: none;
        }

        /* ===== 子节点卡片 ===== */
        .child-node {
            flex: 0 1 calc(50% - 14px);
            min-width: 180px;
            max-width: 460px;
            padding: 14px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.40);
            box-shadow: 0 4px 20px rgba(30, 60, 130, 0.03);
            transition: all 0.3s cubic-bezier(0.34, 1.0, 0.64, 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .child-node:hover {
            background: rgba(255, 255, 255, 0.65);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 40px rgba(40, 80, 200, 0.06);
            border-color: rgba(70, 130, 255, 0.15);
        }
        .child-node:active {
            transform: scale(0.97);
        }
        .child-node .node-index {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(70, 130, 255, 0.08), rgba(70, 130, 255, 0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #3a7ab0;
            border: 1px solid rgba(255, 255, 255, 0.20);
        }
        .child-node .node-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            line-height: 1.3;
            flex: 1;
            letter-spacing: 0.1px;
        }
        .child-node .node-arrow {
            color: var(--primary-light);
            font-size: 18px;
            opacity: 0.25;
            transition: opacity 0.3s ease, transform 0.3s ease;
            flex-shrink: 0;
        }
        .child-node:hover .node-arrow {
            opacity: 0.7;
            transform: translateX(3px);
        }
        .child-node .node-tag {
            font-size: 9px;
            background: rgba(70, 130, 255, 0.06);
            padding: 1px 10px;
            border-radius: 30px;
            color: #4a7ab0;
            font-weight: 400;
            letter-spacing: 0.2px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        /* ===== 空状态 & 加载/错误 ===== */
        .empty-state {
            text-align: center;
            padding: 36px 20px;
            color: #5a7a9a;
            font-size: 15px;
            width: 100%;
            display: none;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .empty-state.visible {
            display: block;
        }
        .empty-state .emoji {
            font-size: 44px;
            margin-bottom: 10px;
            display: block;
        }

        .loading-state {
            text-align: center;
            padding: 36px 20px;
            color: #5a7a9a;
            font-size: 15px;
            width: 100%;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(70, 130, 255, 0.10);
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-state .load-text {
            font-size: 14px;
            color: #4a7ab0;
        }

        .error-state {
            text-align: center;
            padding: 36px 20px;
            width: 100%;
            background: rgba(255, 240, 240, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            border: 1px solid rgba(255, 100, 100, 0.15);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .error-state.visible {
            display: flex;
        }
        .error-state .emoji {
            font-size: 44px;
        }
        .error-state .err-title {
            font-size: 16px;
            font-weight: 600;
            color: #c0392b;
        }
        .error-state .err-desc {
            font-size: 14px;
            color: #5a7a9a;
            max-width: 90%;
        }
        .error-state .retry-btn {
            margin-top: 4px;
            padding: 8px 28px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #4a8af4, #2a6fd4);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(42, 111, 212, 0.15);
        }
        .error-state .retry-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 28px rgba(42, 111, 212, 0.20);
        }
        .error-state .retry-btn:active {
            transform: scale(0.96);
        }

        /* ===== 浮动控件 ===== */
        .controls-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .controls-float .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 6px 16px 6px 20px;

<body>

        <!-- ===== 教程区域 ===== -->
        <div class="mindmap">
            <!-- 栏目卡片将动态渲染到此 -->

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">

                没有找到匹配的教程，试试其他关键词吧
            </div>

            <!-- 加载状态 -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <span class="load-text">📡 正在加载教程数据...</span>
            </div>

            <!-- 错误状态 -->
            <div class="error-state" id="errorState">
                <span class="emoji">⚠️</span>
                <div class="err-title">加载失败</div>
                <div class="err-desc" id="errorDesc">数据获取异常，请检查网络后重试</div>
                <button class="retry-btn" id="retryBtn">🔄 重新加载</button>

        <!-- ===== 底部 ===== -->
        <footer class="footer">

                <span class="count">共 <strong id="totalCount">0</strong> 个教程 · 点击卡片跳转</span>
                <span class="links">
                    <span>💡 点击栏目名展开 / 收起</span>
                </span>
            </div>

    </div>

    <script>
        // ============================================================
        //  数据获取 & 解析（基于缩进识别栏目和条目）
        // ============================================================

        const DATA_URL = 'https://magicphy.github.io/ugcmteach/teacher.txt';

        let groupedData = [];
        let allItems = [];
        let searchQuery = '';
        let currentAlpha = 0.22;
        let isLoading = false;
        let loadError = null;

        // 每个栏目的展开状态
        let categoryExpanded = {};

        // ============================================================
        //  DOM 引用
        // ============================================================
        const container = document.getElementById('categoriesContainer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorDesc = document.getElementById('errorDesc');
        const retryBtn = document.getElementById('retryBtn');
        const totalCount = document.getElementById('totalCount');
        const glassToggle = document.getElementById('glassToggle');
        const appContainer = document.getElementById('appContainer');
        const alphaSlider = document.getElementById('alphaSlider');
        const alphaDisplay = document.getElementById('alphaDisplay');

        // ============================================================
        //  解析函数：通过前导空格区分栏目与条目内容
        //  修复：在切换栏目时，先保存当前正在构建的条目
        // ============================================================
        function parseTutorials(text) {
            const lines = text.split('\n');
            const groups = [];
            let currentCategory = '默认教程';
            let currentItems = [];
            let currentItem = null;

            // 辅助函数：保存当前条目到列表
            function saveCurrentItem() {
                if (currentItem && currentItem.title && currentItem.url) {
                    currentItems.push(currentItem);
                    currentItem = null;
                }
            }

            for (let rawLine of lines) {
                const line = rawLine.trimEnd();
                if (line === '') continue;

                const isIndented = /^ /.test(line);

                if (!isIndented) {
                    // 顶格行：可能是栏目行（以冒号结尾）
                    if (/[:：]$/.test(line)) {
                        // 先保存当前正在构建的条目
                        saveCurrentItem();
                        // 保存之前的栏目
                        if (currentItems.length > 0) {
                            groups.push({ category: currentCategory, items: currentItems });
                            currentItems = [];
                        }
                        currentCategory = line.replace(/[:：]$/, '').trim();
                        continue;
                    } else {
                        // 顶格但不是冒号结尾：忽略
                        continue;
                    }
                }

                // --- 缩进行：条目相关内容 ---
                const content = line.trim();

                // 检查是否为序号行
                const match = content.match(/^\((\d+)\)$/);
                if (match) {
                    // 保存前一个条目
                    saveCurrentItem();
                    currentItem = {
                        id: parseInt(match[1], 10),
                        title: '',
                        url: ''
                    };
                    continue;
                }

                // 如果当前没有正在构建的条目，忽略
                if (!currentItem) continue;

                // 如果是标题（尚未设置标题）
                if (!currentItem.title) {
                    currentItem.title = content;
                    continue;
                }

                // 如果已设置标题但尚未设置链接，则视为链接
                if (!currentItem.url) {
                    currentItem.url = content;
                    continue;
                }

                // 如果标题和链接都已设置，忽略多余行（容错）
            }

            // 文件结束：保存最后一个条目和最后一个栏目
            saveCurrentItem();
            if (currentItems.length > 0) {
                groups.push({ category: currentCategory, items: currentItems });
            }

            return groups;
        }

        // ============================================================
        //  加载 & 错误处理
        // ============================================================
        function showLoading(show) {
            if (show) {
                loadingState.style.display = 'flex';
                errorState.classList.remove('visible');
                emptyState.classList.remove('visible');
                container.innerHTML = '';
            } else {
                loadingState.style.display = 'none';
            }
        }

        function showError(message) {
            errorDesc.textContent = message || '数据获取异常，请检查网络后重试';
            errorState.classList.add('visible');
            loadingState.style.display = 'none';
            emptyState.classList.remove('visible');
            container.innerHTML = '';
            totalCount.textContent = '0';
        }

        function hideAllStatus() {
            loadingState.style.display = 'none';
            errorState.classList.remove('visible');
            emptyState.classList.remove('visible');
        }

        async function loadTutorials() {
            if (isLoading) return;
            isLoading = true;
            loadError = null;

            showLoading(true);
            container.innerHTML = '';

            try {
                const response = await fetch(DATA_URL, {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP_ERROR:${response.status} ${response.statusText}`);
                }

                const text = await response.text();

                if (!text.trim()) {
                    throw new Error('EMPTY_DATA');
                }

                const groups = parseTutorials(text);

                let totalItems = 0;
                groups.forEach(g => totalItems += g.items.length);
                if (totalItems === 0) {
                    throw new Error('PARSE_FAILED');
                }

                groupedData = groups;
                allItems = [];
                groups.forEach(g => {
                    g.items.forEach(item => {
                        allItems.push({ ...item, category: g.category });
                    });
                });

                // 初始化展开状态（默认全部收起）
                groups.forEach(g => {
                    if (!(g.category in categoryExpanded)) {
                        categoryExpanded[g.category] = false;
                    }
                });

                loadError = null;
                hideAllStatus();
                renderTutorials(searchInput.value.trim());
                totalCount.textContent = allItems.length;

                console.log('📦 解析后的分组:', JSON.stringify(groups, null, 2));

            } catch (err) {
                console.error('加载教程失败:', err);
                let errorMsg = '';
                const msg = err.message || '';
                if (msg === 'EMPTY_DATA') {
                    errorMsg = '请求结果为空！请检查文件内容。';
                } else if (msg === 'PARSE_FAILED') {
                    errorMsg = '文件内容不合法！请确保格式正确：栏目名顶格并以冒号结尾，条目内容以空格缩进。';
                } else if (msg.startsWith('HTTP_ERROR:')) {
                    const status = msg.split(':')[1] || '';
                    errorMsg = `服务器响应错误 (${status})，请检查文件是否存在或网络状况`;
                } else if (msg.includes('Failed to fetch') || err.name === 'TypeError') {
                    errorMsg = '服务器连接失败！请检查网络或跨域设置。';
                } else {
                    errorMsg = err.message || '未知错误';
                    if (err.stack) {
                        errorMsg += ' (详见控制台)';
                    }
                }
                loadError = errorMsg;
                showError(errorMsg);
                groupedData = [];
                allItems = [];
                totalCount.textContent = '0';
                categoryExpanded = {};
                if (searchInput.value.trim()) {
                    renderTutorials(searchInput.value.trim());
                }
            } finally {
                isLoading = false;
            }
        }

        // ============================================================
        //  渲染（每个栏目独立折叠）
        // ============================================================
        function renderTutorials(filter = '') {
            const q = filter.trim().toLowerCase();

            // 过滤条目
            let filteredGroups = [];
            if (q) {
                filteredGroups = groupedData.map(group => {
                    const filteredItems = group.items.filter(item =>
                        item.title.toLowerCase().includes(q)
                    );
                    return { category: group.category, items: filteredItems };
                }).filter(group => group.items.length > 0);
            } else {
                filteredGroups = groupedData.map(group => ({
                    category: group.category,
                    items: [...group.items]
                }));
            }

            // 计算总条目数
            let totalFiltered = 0;
            filteredGroups.forEach(g => totalFiltered += g.items.length);

            // 如果所有条目为空且没有搜索词
            if (allItems.length === 0 && !q) {
                if (!isLoading && !errorState.classList.contains('visible')) {
                    emptyState.classList.add('visible');
                    emptyState.innerHTML = `<span class="emoji">📭</span> 暂无教程，请稍后刷新`;
                    container.innerHTML = '';
                }
                return;
            }

            // 搜索无结果
            if (totalFiltered === 0 && q) {
                emptyState.classList.add('visible');
                emptyState.innerHTML = `<span class="emoji">🔎</span> 没有找到匹配的教程，试试其他关键词吧`;
                container.innerHTML = '';
                loadingState.style.display = 'none';
                errorState.classList.remove('visible');
                return;
            }

            // 正常渲染
            emptyState.classList.remove('visible');
            hideAllStatus();

            let html = '';
            filteredGroups.forEach((group, idx) => {
                const catKey = group.category;
                const isExpanded = categoryExpanded[catKey] || false;
                const icon = idx === 0 ? '📖' : '📂';
                const toggleSymbol = isExpanded ? '▼' : '▶';
                const childClass = isExpanded ? '' : 'hidden';

                html += `
                        <div class="category-card" data-category="${catKey}">
                            <div class="cat-header" data-cat-toggle="${catKey}">
                                <div class="cat-title">
                                    <span class="cat-icon">${icon}</span>
                                    <span>${catKey}</span>
                                    <span class="cat-badge">${group.items.length}</span>
                                </div>
                                <span class="cat-toggle ${isExpanded ? '' : 'collapsed'}">${toggleSymbol}</span>
                            </div>
                            <div class="cat-children ${childClass}">
                    `;

                group.items.forEach((item, itemIdx) => {
                    const displayIndex = itemIdx + 1;
                    const safeTitle = item.title.replace(/"/g, '&quot;');
                    html += `
                            <div class="child-node" data-id="${item.id}" data-title="${safeTitle}" role="button" tabindex="0">
                                <span class="node-index">${displayIndex}</span>
                                <span class="node-title">${item.title}</span>
                                <span class="node-tag">→</span>
                                <span class="node-arrow">›</span>
                            </div>
                        `;
                });

                html += `
                            </div>
                        </div>
                    `;
            });

            container.innerHTML = html;

            // 绑定卡片点击事件（展开/收起）
            container.querySelectorAll('.cat-header').forEach(header => {
                const catKey = header.dataset.catToggle;
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleCategory(catKey);
                });
                header.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleCategory(catKey);
                    }
                });
                header.setAttribute('role', 'button');
                header.setAttribute('tabindex', '0');
                header.setAttribute('aria-expanded', categoryExpanded[catKey] || false);
            });

            // 绑定子卡片点击跳转
            container.querySelectorAll('.child-node').forEach(el => {
                const id = parseInt(el.dataset.id, 10);
                const tutorial = allItems.find(t => t.id === id);
                if (tutorial) {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.open(tutorial.url, '_blank', 'noopener,noreferrer');
                    });
                    el.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            window.open(tutorial.url, '_blank', 'noopener,noreferrer');
                        }
                    });
                }
            });
        }

        // ============================================================
        //  切换栏目展开/收起
        // ============================================================
        function toggleCategory(catKey) {
            if (!(catKey in categoryExpanded)) return;
            categoryExpanded[catKey] = !categoryExpanded[catKey];
            renderTutorials(searchInput.value.trim());
        }

        // ============================================================
        //  搜索
        // ============================================================
        function handleSearch() {
            const q = searchInput.value;
            searchQuery = q;
            if (q.trim()) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }

            if (errorState.classList.contains('visible')) {
                return;
            }

            if (allItems.length > 0) {
                renderTutorials(q);
            } else {
                if (q.trim()) {
                    emptyState.classList.add('visible');
                    emptyState.innerHTML = `<span class="emoji">🔎</span> 没有找到匹配的教程，试试其他关键词吧`;
                    container.innerHTML = '';
                } else {
                    emptyState.classList.remove('visible');
                }
            }
        }

        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.remove('visible');
            searchQuery = '';
            if (allItems.length > 0) {
                renderTutorials('');
            } else {
                emptyState.classList.remove('visible');
                if (errorState.classList.contains('visible')) {
                    // 保持错误状态
                } else if (isLoading) {
                    showLoading(true);
                } else {
                    emptyState.classList.add('visible');
                    emptyState.innerHTML = `<span class="emoji">📭</span> 暂无教程，请稍后刷新`;
                }
            }
        }

        // ============================================================
        //  透明度 & 液态玻璃控制
        // ============================================================
        function updateAlpha(val) {
            currentAlpha = parseFloat(val);
            const pct = Math.round(currentAlpha * 100);
            alphaDisplay.textContent = pct + '%';
            document.documentElement.style.setProperty('--glass-alpha', currentAlpha);
            try { localStorage.setItem('glassAlpha', currentAlpha); } catch (_) {}
        }

        function toggleGlassEffect(enable) {
            if (enable) {
                appContainer.classList.add('glass-liquid');
            } else {
                appContainer.classList.remove('glass-liquid');
            }
            try { localStorage.setItem('glassEffect', enable ? '1' : '0'); } catch (_) {}
        }

        // ============================================================
        //  随机背景
        // ============================================================
        function setRandomBackground() {
            const bgLayer = document.getElementById('bg-layer');
            const fallbackUrls = [
                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80',
                'https://images.unsplash.com/photo-1470071459604-7b5ec3f2a0c5?w=1920&q=80',
                'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80',
                'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80',
                'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80',
                'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80',
                'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920&q=80',
                'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1920&q=80',
                'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80'
            ];
            const selected = fallbackUrls[Math.floor(Math.random() * fallbackUrls.length)];
            const img = new Image();
            img.src = selected;
            img.onload = () => { bgLayer.style.backgroundImage = `url(${selected})`; };
            img.onerror = () => {
                const backup = fallbackUrls[Math.floor(Math.random() * fallbackUrls.length)];
                bgLayer.style.backgroundImage = `url(${backup})`;
            };
        }

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            setRandomBackground();

            try {
                const savedAlpha = localStorage.getItem('glassAlpha');
                if (savedAlpha !== null) {
                    const a = parseFloat(savedAlpha);
                    if (!isNaN(a) && a >= 0.04 && a <= 0.85) {
                        currentAlpha = a;
                        alphaSlider.value = a;
                    }
                }
                const glassPref = localStorage.getItem('glassEffect');
                if (glassPref !== null) {
                    const enabled = glassPref === '1';
                    glassToggle.checked = enabled;
                    toggleGlassEffect(enabled);
                } else {
                    glassToggle.checked = true;
                    toggleGlassEffect(true);
                }
            } catch (_) {}

            updateAlpha(alphaSlider.value);

            searchInput.addEventListener('input', handleSearch);
            clearBtn.addEventListener('click', clearSearch);

            glassToggle.addEventListener('change', (e) => {
                toggleGlassEffect(e.target.checked);
            });

            alphaSlider.addEventListener('input', (e) => {
                updateAlpha(e.target.value);
            });

            retryBtn.addEventListener('click', () => {
                loadTutorials();
            });

            let bgInterval;
            function startBgRotation() {
                bgInterval = setInterval(setRandomBackground, 5 * 60 * 1000);
            }
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    clearInterval(bgInterval);
                } else {
                    clearInterval(bgInterval);
                    startBgRotation();
                    if (allItems.length === 0 && !errorState.classList.contains('visible') && !isLoading) {
                        loadTutorials();
                    }
                }
            });
            startBgRotation();

            await loadTutorials();

            console.log('🌳 PHYの绿洲共创教程 已加载 (数据来源: ' + DATA_URL + ')');
            console.log('📚 共 ' + allItems.length + ' 个教程');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
